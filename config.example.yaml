# Aether Office Configuration Template
# Copy this file to `config.yaml` and adjust settings according to your environment.

# Central LLM Router / Gateway Configuration
# Works with any OpenAI-compatible router (e.g. OneAPI, NewAPI, LiteLLM, OpenRouter, Ollama)
# The endpoint and api_key below connect to the router itself.
# Multiple models can be called through this single router.
llm:
  endpoint: "http://localhost:20128/v1"
  api_key: "your-router-api-key-here"
  model: "gratisan"              # Default fallback model on the router
  temperature: 0.7
  max_tokens: 4096
  timeout: 45                    # Recommended 30-60s timeout for fast failover
  max_retries: 2                 # Retries before switching to next fallback

  # Automatic Failover Chain (switches seamlessly if primary model hangs, times out, or errors)
  fallbacks:
    - gemini
    - groq
    - openrouter

  # Optional: Route specific workforce roles or define provider presets
  models:
    default: "gratisan"
    pm: "gratisan"
    conceptor: "gratisan"
    developer: "gratisan"        # e.g., coding-specific model
    qa: "gratisan"               # e.g., testing/validation model
    planning: "gratisan"         # e.g., deep reasoning model
    smart: "gratisan"            # e.g., flagship model
    fast: "gratisan"             # e.g., lightweight model

    # Provider Presets for Fallback Chain:
    gemini:
      endpoint: "https://generativelanguage.googleapis.com/v1beta"
      model: "gemini-3.6-flash"
      api_key: "your-gemini-api-key"
      timeout: 45
    groq:
      endpoint: "https://api.groq.com/openai/v1"
      model: "qwen/qwen3.8-27b"
      api_key: "your-groq-api-key"
      timeout: 30
    openrouter:
      endpoint: "https://openrouter.ai/api/v1"
      model: "minimax/minimax-m3:free"
      api_key: "your-openrouter-api-key"
      timeout: 45

developer:
  unit_max_retries: 2    # Maximum retries per code generation unit

project:
  output_dir: "./projects"
  data_dir: "./data"
  docs_dir: "./shared-docs"

qa:
  max_retries: 3
  run_tests: true

# Pixel Agents 2D Virtual Office Simulation Integration
pixel_agents:
  enabled: true                  # Set to true to visualize agents in Pixel Agents
  auto_discover: true            # Automatically discover local server token from ~/.pixel-agents/
  host: "127.0.0.1"
  port: 3100
  token: null                    # Discovered automatically if null
